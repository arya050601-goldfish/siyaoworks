  <text x="90" y="548" fill="#6c6861" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700">金鱼 · 产品经营案例</text>
  <rect x="1092" y="528" width="22" height="22" transform="rotate(45 1103 539)" fill="#c23f35"/>
</svg>
