    <text x="24" y="77" fill="#ffffff" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="800">角色 / 资源</text>
    <text x="24" y="111" fill="#ffffff" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="800">进度 / 卡点</text>
